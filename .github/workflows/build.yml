name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/com/videograb/app app/src/main/assets/www app/src/main/res/drawable
          mv MainActivity.kt app/src/main/java/com/videograb/app/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/www/
          mv app-build.gradle app/build.gradle
          IMG=$(find . -maxdepth 1 \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | head -n1)
          if [ -n "$IMG" ]; then
            ext=$(echo "${IMG##*.}" | tr 'A-Z' 'a-z')
            if [ "$ext" = jpeg ]; then ext=jpg; fi
            cp "$IMG" app/src/main/res/drawable/ic_launcher.$ext
          else
            cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M42,32L42,76L78,54z"/>
          </vector>
          XML
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true
      - uses: actions/upload-artifact@v4
        with:
          name: VideoGrab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
