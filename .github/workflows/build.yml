name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          mkdir -p app/src/main/java/com/videograb/app app/src/main/assets/www app/src/main/res/drawable
          mv MainActivity.kt app/src/main/java/com/videograb/app/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/www/
          mv app-build.gradle app/build.gradle
          IMG=$(find . -maxdepth 1 \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | head -n1)
          ext=$(echo "${IMG##*.}" | tr 'A-Z' 'a-z')
          [ "$ext" = jpeg ] && ext=jpg
          cp "$IMG" app/src/main/res/drawable/ic_launcher.$ext
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true
      - uses: actions/upload-artifact@v4
        with:
          name: VideoGrab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
